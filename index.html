<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Mind — Studio</title>
<link rel="icon" href="shared/brand/bm-mark.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D131A;--side:#0D131A;--ink:#fff;--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.12);--red:#D7000F;--light:#F1F2F2;--open:340px;--rail:60px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
/* Layout only changes when the pin is toggled. Unpinned, the sidebar expands as an overlay, so the design in the
   iframe is never resized by hovering (a resize re-runs every scroll/WebGL layout inside it). */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100dvh}
.app.pinned{grid-template-columns:var(--open) minmax(0,1fr)}
aside{position:relative;z-index:20;width:var(--rail);height:100dvh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s}
.app.pinned aside,aside.peek{width:var(--open)}
aside.peek{box-shadow:24px 0 60px -20px rgba(13,19,26,.9)}
.app:not(.pinned) aside{position:absolute;left:0;top:0}
.app:not(.pinned) main{grid-column:2}
.head{display:flex;align-items:center;gap:10px;padding:18px 12px 14px 14px;border-bottom:1px solid var(--line);min-height:68px}
.logo{flex:none;width:32px;height:32px;display:grid;place-items:center}
.logo img{width:32px;height:auto}
.word{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.word img{width:112px;display:block}
.word span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.iconbtn{flex:none;width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.iconbtn[aria-pressed="true"]{color:var(--red);background:rgba(215,0,15,.12)}
.iconbtn svg{width:18px;height:18px}
aside:not(.peek) .expanded-only{visibility:hidden}
.app.pinned aside .expanded-only{visibility:visible}
nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px;display:grid;gap:4px;align-content:start;scrollbar-width:thin}
.item{border-radius:14px;padding:10px 8px 12px;position:relative;cursor:pointer}
.item:hover{background:rgba(255,255,255,.04)}
.item.on{background:rgba(215,0,15,.12);box-shadow:inset 3px 0 0 var(--red)}
.row{display:grid;grid-template-columns:36px minmax(0,1fr);gap:2px 8px;align-items:start}
.n{font:700 20px/1 "DIN Condensed",Oswald,sans-serif;color:var(--muted);text-align:center;padding-top:2px}
.item.on .n{color:var(--red)}
.t{font:600 14.5px/1.25 Oswald,sans-serif;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.z{grid-column:2;font-size:12px;color:rgba(255,255,255,.78);line-height:1.45;margin-top:2px}
.vers{display:none}
.vers button{flex:1;min-width:0;border:0;border-radius:999px;padding:7px 0;background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);font:600 11px/1 Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.vers button:hover:not(:disabled){background:rgba(255,255,255,.14);color:#fff}
.vers button[aria-pressed="true"]{background:var(--red);color:#fff}
.vers button:disabled{opacity:.35;cursor:not-allowed}
aside:not(.peek) .item .z,aside:not(.peek) .item .vers,aside:not(.peek) .item .t{visibility:hidden}
.app.pinned aside .item .z,.app.pinned aside .item .vers,.app.pinned aside .item .t{visibility:visible}
.foot{padding:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.foot a{color:#fff;text-decoration:none;display:flex;gap:8px;align-items:center;justify-content:center;padding:11px;border-radius:999px;background:var(--red);font:600 12px/1 Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.foot small{font-size:11.5px;color:var(--muted);line-height:1.45}
aside:not(.peek) .foot{visibility:hidden}
.app.pinned aside .foot{visibility:visible}
main{position:relative;min-width:0;background:var(--bg)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.badge{position:absolute;left:14px;top:14px;z-index:2;font:600 11px/1 Oswald,sans-serif;letter-spacing:.16em;text-transform:uppercase;background:rgba(13,19,26,.86);backdrop-filter:blur(8px);padding:9px 12px;border-radius:999px;color:#fff;pointer-events:none;transition:opacity .6s}
.badge b{color:var(--red);font-weight:600}
/* phone: a top bar with the design chips and the 1/2/3 switch; no collapse needed */
@media (max-width:820px){
  .app,.app.pinned{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  aside,.app.pinned aside,aside.peek,.app:not(.pinned) aside{position:relative;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line);box-shadow:none}
  .app:not(.pinned) main{grid-column:1}
  .head{min-height:0;padding:8px 12px}.word span,.iconbtn{display:none}
  aside .expanded-only,aside .item .t{visibility:visible!important}
  nav{display:flex;overflow-x:auto;padding:6px 10px 8px;gap:6px;scrollbar-width:none}
  .item{flex:none;padding:8px 12px;border-radius:999px}.row{display:flex;gap:8px;align-items:center}
  .item .z,.item .vers,.foot{display:none!important}.n{font-size:17px}
  .mver{display:flex!important}
}
.mver{display:none!important}
.mver button{flex:1;border:0;border-radius:999px;padding:9px 0;background:rgba(255,255,255,.08);color:#fff;font:600 12px/1 Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.mver button[aria-pressed="true"]{background:var(--red)}
.mver button:disabled{opacity:.35}
</style>
</head>
<body>
<div class="app" id="app">
  <aside id="side" aria-label="Designs">
    <div class="head">
      <div class="logo"><img src="shared/brand/bm-mark.webp" alt="Battle Mind"></div>
      <div class="word expanded-only"><img src="shared/brand/battle-red.webp" alt="Battle"><span>8 designs · Studio edition</span></div>
      <button class="iconbtn expanded-only" id="pin" aria-pressed="false" title="Pin the sidebar open">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76V6h6v4.76l2.5 3.24H6.5z"/><path d="M8 3h8"/></svg>
      </button>
    </div>
    <nav id="nav"></nav>
    <div class="mver" id="mver"></div>
    <div class="foot">
      <a id="full" href="#" target="_blank" rel="noopener">Open full screen ↗</a>
      <small>Studio edition: new looks, new 3D. Move your mouse over each hero. Unpinned, the sidebar opens when you hover it.</small>
    </div>
  </aside>
  <main><iframe id="view" title="Design preview"></iframe><div class="badge" id="badge"></div></main>
</div>
<script>
const D = [
  ["01","scrollytelling","Scrollytelling","整页像一部片，往下滑故事一幕一幕推进"],
  ["02","pinned","Pinned / Sticky","画面钉住不动，滑动只换里面的内容"],
  ["03","scrubbed","Scroll-scrubbed video","滑动速度就是播放速度，往回滑就倒放"],
  ["04","parallax","Parallax","前景和背景不同速度移动，有景深感"],
  ["05","reveal","Scroll-triggered reveal","元素滑进画面才淡入或滑入"],
  ["06","smooth","Smooth scroll","滚动带惯性、很丝滑，是电影感的关键"],
  ["07","webgl","3D / WebGL scroll","滑动时镜头在 3D 场景里移动"],
  ["08","flow","Flow (no blocks)","没有方块：墨水、曲线、圆形，一条红线画完整页"],
];
const V = [["1", "Studio"]];  // the new site has one look; the original 3-version site stays at :9920
const app = document.getElementById("app"), side = document.getElementById("side"), nav = document.getElementById("nav"),
  view = document.getElementById("view"), full = document.getElementById("full"), badge = document.getElementById("badge"),
  pinBtn = document.getElementById("pin"), mver = document.getElementById("mver");
const avail = {};   // "v2/02-pinned.html" -> true once the file answers
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const file = (d, v) => `studio/${d[0]}-${d[1]}.html`;

nav.innerHTML = D.map((d) => `<div class="item" data-k="${d[1]}" title="${d[2]}"><div class="row"><span class="n">${d[0]}</span><span class="t">${d[2]}</span>
  <span class="z">${d[3]}</span><span class="vers">${V.map(([v, l]) => `<button data-v="${v}" disabled title="${l}">${v} ${l}</button>`).join("")}</span></div></div>`).join("");
mver.innerHTML = V.map(([v, l]) => `<button data-v="${v}" disabled>${v} ${l}</button>`).join("");

function parse() {
  const [k, v] = location.hash.slice(1).split("/");
  const d = D.find((x) => x[1] === k) || D[0];
  return { d, v: "1" };
}
function show() {
  let { d, v } = parse();
  
  const src = file(d, v);
  if (!view.src.endsWith(src)) view.src = src;
  full.href = src; store.set("ver:" + d[1], v);
  document.title = `${d[2]} · ${V[v - 1][1]} — Battle Mind`;
  badge.innerHTML = `${d[0]} ${d[2]} · <b>Studio</b>`; badge.style.opacity = 1;
  clearTimeout(show.t); show.t = setTimeout(() => (badge.style.opacity = 0), 2400);
  nav.querySelectorAll(".item").forEach((it) => {
    const on = it.dataset.k === d[1]; it.classList.toggle("on", on);
    it.querySelectorAll(".vers button").forEach((b) => b.setAttribute("aria-pressed", on && b.dataset.v === v));
  });
  mver.querySelectorAll("button").forEach((b) => { b.setAttribute("aria-pressed", b.dataset.v === v); b.disabled = avail[file(d, b.dataset.v)] === false; });
  nav.querySelector(".item.on")?.scrollIntoView({ block: "nearest", inline: "nearest" });
}
nav.addEventListener("click", (e) => {
  const it = e.target.closest(".item"); if (!it) return;
  const b = e.target.closest(".vers button");
  if (b && b.disabled) return;
  const v = b ? b.dataset.v : (store.get("ver:" + it.dataset.k) || "2");
  location.hash = `${it.dataset.k}/${v}`;
});
mver.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b && !b.disabled) location.hash = `${parse().d[1]}/${b.dataset.v}`; });
addEventListener("hashchange", show);

// pin: pinned = open and part of the layout; unpinned = a slim rail that opens over the page on hover
function setPin(p) { app.classList.toggle("pinned", p); pinBtn.setAttribute("aria-pressed", p); pinBtn.title = p ? "Unpin (collapse to a rail)" : "Pin the sidebar open"; store.set("pinned", p ? "1" : "0"); side.classList.remove("peek"); }
pinBtn.addEventListener("click", () => setPin(!app.classList.contains("pinned")));
let peekT;
side.addEventListener("mouseenter", () => { clearTimeout(peekT); if (!app.classList.contains("pinned")) side.classList.add("peek"); });
side.addEventListener("mouseleave", () => { peekT = setTimeout(() => side.classList.remove("peek"), 180); });
setPin(store.get("pinned") !== "0");

// which versions exist: one HEAD request each, then enable their buttons
Promise.all(D.flatMap((d) => V.map(async ([v]) => {
  const f = file(d, v);
  try { avail[f] = (await fetch(f, { method: "HEAD", cache: "no-store" })).ok; } catch (e) { avail[f] = false; }
  const btn = nav.querySelector(`.item[data-k="${d[1]}"] .vers button[data-v="${v}"]`);
  btn.disabled = !avail[f]; if (!avail[f]) btn.title += " (coming)";
}))).then(show);
show();
</script>
</body>
</html>
